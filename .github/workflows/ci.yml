name: product-contracts

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: product-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # The managed ClickPipe is executable infrastructure, not deployment prose. Validation in
      # the same product-contract job catches provider-schema drift before a production apply.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"

      # scripts/check.sh uses ripgrep to discover tests and scripts rather than maintaining a
      # second file manifest that drifts as agents add modules. GitHub's Ubuntu image does not
      # promise rg even though every development machine currently has it.
      - name: Install repository check dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      # The SQL suite deliberately applies the forward migration to a real 0001 database and
      # impersonates anon/authenticated JWT subjects. Static parsing cannot exercise either RLS
      # or the documented public-Storage upgrade state, so CI owns a disposable local stack.
      - name: Start disposable Supabase
        run: supabase start

      - name: Check every runtime contract
        run: ./scripts/check.sh

      # Supabase and the pinned ClickHouse parser image together consume enough of GitHub's
      # runner disk that Flutter can fail while writing app.dill even though the build is healthy.
      # The contract gate has finished using both containers at this point, so release their
      # layers before Gradle expands the Android toolchain and release artifact.
      - name: Reclaim container disk before Android release
        run: |
          supabase stop --no-backup
          docker system prune --all --force --volumes

      - name: Build Android release artifact
        working-directory: app
        run: flutter build apk --release --no-pub

      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
